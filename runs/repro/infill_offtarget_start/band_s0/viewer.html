<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolpath Viewer</title>
<style>
:root {
  --bg: #f6f6f4; --fg: #1d1d1f; --muted: #66666d; --panel: #ffffff; --border: #dadadd;
  --accent: #2f6fde; --travel: #7c7f88; --seam: #e8590c; --end: #3d3f45; --hl: rgba(225, 40, 95, 0.42);
  --path: #2f3237; --grid: rgba(0, 0, 0, 0.055); --reject: #c92a2a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131417; --fg: #e7e7ea; --muted: #9b9ba3; --panel: #1c1e22; --border: #32353b;
    --accent: #6ea0ff; --travel: #858893; --seam: #ff922b; --end: #cfd0d6; --hl: rgba(255, 95, 145, 0.48);
    --path: #d3d5db; --grid: rgba(255, 255, 255, 0.07); --reject: #ff6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131417; --fg: #e7e7ea; --muted: #9b9ba3; --panel: #1c1e22; --border: #32353b;
  --accent: #6ea0ff; --travel: #858893; --seam: #ff922b; --end: #cfd0d6; --hl: rgba(255, 95, 145, 0.48);
  --path: #d3d5db; --grid: rgba(255, 255, 255, 0.07); --reject: #ff6b6b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.01em; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 12px 16px 24px; }
@media (max-width: 880px) { main { grid-template-columns: minmax(0, 1fr); } }
#canvas-wrap { position: relative; height: min(66vh, 760px); min-height: 280px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--panel); overflow: hidden; touch-action: none; }
#view { width: 100%; height: 100%; display: block; cursor: grab; }
#view:active { cursor: grabbing; }
.zoom { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.zoom button { min-width: 34px; padding: 4px 8px; }
#legend { position: absolute; left: 8px; bottom: 8px; padding: 6px 8px; border-radius: 6px; font-size: 12px;
  background: var(--panel); border: 1px solid var(--border); max-width: calc(100% - 16px); }
#legend .bar { height: 8px; width: 160px; max-width: 100%; border-radius: 3px; margin: 4px 0 2px; }
#legend .ends { display: flex; justify-content: space-between; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 10px; }
.controls label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.grow { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; min-width: 0; }
.grow input[type="range"] { flex: 1 1 auto; min-width: 100px; width: 100%; }
.mono { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
button, select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px; min-height: 32px; cursor: pointer; }
button:hover, select:hover { border-color: var(--accent); }
input[type="range"] { accent-color: var(--accent); }
#chart-wrap { margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
#chart { width: 100%; height: 190px; display: block; cursor: crosshair; }
#edit-info, .note { color: var(--muted); font-size: 13px; margin-top: 6px; overflow-wrap: anywhere; }
aside { min-width: 0; }
aside section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
aside h2 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
td { padding: 3px 2px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
td:last-child { text-align: right; }
td:first-child { white-space: nowrap; overflow-wrap: normal; padding-right: 12px; color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Toolpath viewer</h1>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="layer" aria-selected="true">Layer</button>
    <button role="tab" data-tab="playback" aria-selected="false">Nozzle playback</button>
    <button role="tab" data-tab="history" aria-selected="false" id="tab-history">Optimization history</button>
  </div>
</header>
<main>
  <section>
    <div id="canvas-wrap">
      <canvas id="view" aria-label="toolpath canvas"></canvas>
      <div class="zoom">
        <button id="zin" title="Zoom in">+</button>
        <button id="zout" title="Zoom out">&minus;</button>
        <button id="zfit" title="Fit (double-click)">Fit</button>
      </div>
      <div id="legend"></div>
    </div>
    <div class="controls">
      <div class="grow"><label for="layer">Layer</label><input type="range" id="layer" min="0" max="0" value="0"><span class="mono" id="layer-label"></span></div>
      <label>Colour <select id="color">
        <option value="direction">bead direction</option>
        <option value="order">print order</option>
        <option value="fi">failure index</option>
        <option value="stroke">stroke</option>
      </select></label>
      <label><input type="checkbox" id="travels" checked> travels</label>
      <label><input type="checkbox" id="markers" checked> seams &amp; ends</label>
    </div>
    <div class="controls" id="ctl-play" hidden>
      <button id="play">Play</button>
      <label>Speed <select id="speed">
        <option value="1">1&times;</option><option value="2">2&times;</option><option value="5">5&times;</option>
        <option value="10" selected>10&times;</option><option value="25">25&times;</option><option value="100">100&times;</option>
      </select></label>
      <div class="grow"><input type="range" id="time" min="0" max="1000" value="0" aria-label="time"><span class="mono" id="time-label"></span></div>
    </div>
    <div id="ctl-hist" hidden>
      <div class="controls">
        <button id="hplay">Play</button>
        <label>Rate <select id="hspeed">
          <option value="5">5 / s</option><option value="20" selected>20 / s</option>
          <option value="100">100 / s</option><option value="500">500 / s</option>
        </select></label>
        <button id="prev-acc" title="Previous accepted edit">&#9664; accepted</button>
        <button id="next-acc" title="Next accepted edit">accepted &#9654;</button>
        <label><input type="checkbox" id="follow" checked> follow edited layer</label>
      </div>
      <div class="controls">
        <div class="grow"><label for="iter">Iteration</label><input type="range" id="iter" min="0" max="0" value="0"><span class="mono" id="iter-label"></span></div>
      </div>
      <div id="edit-info"></div>
      <div id="chart-wrap"><canvas id="chart" aria-label="score chart"></canvas></div>
      <div class="note">Chart: change since the start in normalized score units (total and each term). The exported part is the best one seen, which can differ from the last iteration when annealing accepted worse edits.</div>
    </div>
  </section>
  <aside>
    <section><h2>Layer</h2><table id="layer-table"></table></section>
    <section><h2>Run</h2><table id="meta-table"></table></section>
  </aside>
</main>

  $("speed").addEventListener("change", function (e) { S.speed = +e.target.value; });
  $("time").addEventListener("input", function (e) { S.t = (+e.target.value) / 1000 * (LAY[S.layer].T || 0); syncTime(); requestDraw(); });
  $("hplay").addEventListener("click", function () { setPlaying(!S.playing); });
  $("hspeed").addEventListener("change", function (e) { S.hspeed = +e.target.value; });
  $("iter").addEventListener("input", function (e) { setIter(+e.target.value); });
  $("prev-acc").addEventListener("click", function () { stepAccepted(-1); });
  $("next-acc").addEventListener("click", function () { stepAccepted(1); });
  $("follow").addEventListener("change", function (e) { S.follow = e.target.checked; });
  chart.addEventListener("click", function (e) {
    const w = chart.clientWidth, L = 46, R = 10;
    setIter(Math.round((e.offsetX - L) / Math.max(w - L - R, 1) * HI.H.n));
  });
  document.addEventListener("keydown", function (e) {
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const d = e.key === "ArrowRight" ? 1 : -1;
      if (S.tab === "history") setIter(S.iter + d); else setLayer(S.layer + d);
      e.preventDefault();
    } else if (e.key === " ") {
      if (S.tab !== "layer") { setPlaying(!S.playing); e.preventDefault(); }
    }
  });
  if (!LAY.some(function (d) { return d.fi; })) $("color").querySelector('option[value="fi"]').disabled = true;
  if (!HI) $("tab-history").hidden = true;
  else { $("iter").max = HI.H.n; }
  fillTable($("meta-table"), flatten(DATA.meta, "", []));
  if (window.matchMedia) {
    const mq = matchMedia("(prefers-color-scheme: dark)");
    const onTheme = function () { readTheme(); legend(); requestDraw(); drawChart(); };
    if (mq.addEventListener) mq.addEventListener("change", onTheme);
  }
  readTheme();
  setLayer(0);
  if (HI) setIter(HI.H.n);
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(resize).observe($("canvas-wrap"));
    new ResizeObserver(drawChart).observe(chart);
  } else {
    window.addEventListener("resize", resize);
  }
  resize();
})();
</script>
</body>
</html>
