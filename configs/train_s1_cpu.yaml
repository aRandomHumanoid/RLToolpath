# Stage 1 only, sized for ~30 min on a 16-core CPU (no GPU):
# 32x32 grids, strength only, Flip + Patch refill; BC warm-start then PPO fine-tune.
seed: 1
threads: 8
holdout_families: [ribs]
env: {p: 0.4, episode_len: 64}
ppo: {num_envs: 16, num_steps: 64, minibatch_size: 128, epochs: 4, lr: 1.0e-4, ent_coef: 0.003,
      target_kl: 0.03, save_every: 5, image_every: 10}
stages:
  - name: s1_strength
    grid: 32
    terms: [strength]
    ops: [flip_right, flip_down, patch5_0, patch5_90, patch9_0, patch9_90]
    imitation: {states: 8000, candidates: 32, sa_steps: 128, epochs: 15, workers: 12, batch: 64}
    ppo: {total_steps: 150000}
