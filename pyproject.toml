[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rltp"
version = "0.1.0"
description = "RL toolpath optimizer: dense per-layer covers improved by a learned edit policy"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.0",
    "shapely>=2.0",
    "torch>=2.1",
    "gymnasium>=0.29",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "networkx",
    "lxml",
]

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]

[project.scripts]
rltp = "rltp.cli:main"

[tool.setuptools.packages.find]
include = ["rltp*"]

[tool.setuptools.package-data]
"rltp.export" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (deselect with -m 'not slow')"]
