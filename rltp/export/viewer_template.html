<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolpath Viewer</title>
<style>
:root {
  --bg: #f6f6f4; --fg: #1d1d1f; --muted: #66666d; --panel: #ffffff; --border: #dadadd;
  --accent: #2f6fde; --travel: #7c7f88; --seam: #e8590c; --end: #3d3f45; --hl: rgba(225, 40, 95, 0.42);
  --path: #2f3237; --grid: rgba(0, 0, 0, 0.055); --reject: #c92a2a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131417; --fg: #e7e7ea; --muted: #9b9ba3; --panel: #1c1e22; --border: #32353b;
    --accent: #6ea0ff; --travel: #858893; --seam: #ff922b; --end: #cfd0d6; --hl: rgba(255, 95, 145, 0.48);
    --path: #d3d5db; --grid: rgba(255, 255, 255, 0.07); --reject: #ff6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131417; --fg: #e7e7ea; --muted: #9b9ba3; --panel: #1c1e22; --border: #32353b;
  --accent: #6ea0ff; --travel: #858893; --seam: #ff922b; --end: #cfd0d6; --hl: rgba(255, 95, 145, 0.48);
  --path: #d3d5db; --grid: rgba(255, 255, 255, 0.07); --reject: #ff6b6b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.01em; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 12px 16px 24px; }
@media (max-width: 880px) { main { grid-template-columns: minmax(0, 1fr); } }
#canvas-wrap { position: relative; height: min(66vh, 760px); min-height: 280px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--panel); overflow: hidden; touch-action: none; }
#view { width: 100%; height: 100%; display: block; cursor: grab; }
#view:active { cursor: grabbing; }
.zoom { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.zoom button { min-width: 34px; padding: 4px 8px; }
#legend { position: absolute; left: 8px; bottom: 8px; padding: 6px 8px; border-radius: 6px; font-size: 12px;
  background: var(--panel); border: 1px solid var(--border); max-width: calc(100% - 16px); }
#legend .bar { height: 8px; width: 160px; max-width: 100%; border-radius: 3px; margin: 4px 0 2px; }
#legend .ends { display: flex; justify-content: space-between; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 10px; }
.controls label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.grow { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; min-width: 0; }
.grow input[type="range"] { flex: 1 1 auto; min-width: 100px; width: 100%; }
.mono { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
button, select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px; min-height: 32px; cursor: pointer; }
button:hover, select:hover { border-color: var(--accent); }
input[type="range"] { accent-color: var(--accent); }
#chart-wrap { margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
#chart { width: 100%; height: 190px; display: block; cursor: crosshair; }
#edit-info, .note { color: var(--muted); font-size: 13px; margin-top: 6px; overflow-wrap: anywhere; }
aside { min-width: 0; }
aside section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
aside h2 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
td { padding: 3px 2px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
td:last-child { text-align: right; }
td:first-child { white-space: nowrap; overflow-wrap: normal; padding-right: 12px; color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Toolpath viewer</h1>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="layer" aria-selected="true">Layer</button>
    <button role="tab" data-tab="playback" aria-selected="false">Nozzle playback</button>
    <button role="tab" data-tab="history" aria-selected="false" id="tab-history">Optimization history</button>
  </div>
</header>
<main>
  <section>
    <div id="canvas-wrap">
      <canvas id="view" aria-label="toolpath canvas"></canvas>
      <div class="zoom">
        <button id="zin" title="Zoom in">+</button>
        <button id="zout" title="Zoom out">&minus;</button>
        <button id="zfit" title="Fit (double-click)">Fit</button>
      </div>
      <div id="legend"></div>
    </div>
    <div class="controls">
      <div class="grow"><label for="layer">Layer</label><input type="range" id="layer" min="0" max="0" value="0"><span class="mono" id="layer-label"></span></div>
      <label>Colour <select id="color">
        <option value="direction">bead direction</option>
        <option value="order">print order</option>
        <option value="fi">failure index</option>
        <option value="stroke">stroke</option>
      </select></label>
      <label><input type="checkbox" id="travels" checked> travels</label>
      <label><input type="checkbox" id="markers" checked> seams &amp; ends</label>
    </div>
    <div class="controls" id="ctl-play" hidden>
      <button id="play">Play</button>
      <label>Speed <select id="speed">
        <option value="1">1&times;</option><option value="2">2&times;</option><option value="5">5&times;</option>
        <option value="10" selected>10&times;</option><option value="25">25&times;</option><option value="100">100&times;</option>
      </select></label>
      <div class="grow"><input type="range" id="time" min="0" max="1000" value="0" aria-label="time"><span class="mono" id="time-label"></span></div>
    </div>
    <div id="ctl-hist" hidden>
      <div class="controls">
        <button id="hplay">Play</button>
        <label>Rate <select id="hspeed">
          <option value="5">5 / s</option><option value="20" selected>20 / s</option>
          <option value="100">100 / s</option><option value="500">500 / s</option>
        </select></label>
        <button id="prev-acc" title="Previous accepted edit">&#9664; accepted</button>
        <button id="next-acc" title="Next accepted edit">accepted &#9654;</button>
        <label><input type="checkbox" id="follow" checked> follow edited layer</label>
      </div>
      <div class="controls">
        <div class="grow"><label for="iter">Iteration</label><input type="range" id="iter" min="0" max="0" value="0"><span class="mono" id="iter-label"></span></div>
      </div>
      <div id="edit-info"></div>
      <div id="chart-wrap"><canvas id="chart" aria-label="score chart"></canvas></div>
      <div class="note">Chart: change since the start in normalized score units (total and each term). The exported part is the best one seen, which can differ from the last iteration when annealing accepted worse edits.</div>
    </div>
  </section>
  <aside>
    <section><h2>Layer</h2><table id="layer-table"></table></section>
    <section><h2>Run</h2><table id="meta-table"></table></section>
  </aside>
</main>
<script type="application/json" id="rltp-data">__RLTP_DATA__</script>
<script>
"use strict";
/* Pure helpers (no DOM): decoding, stroke walking, ordering, history replay. */
const RLTP = (function () {
  const B64 = new Int16Array(128).fill(-1);
  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/".split("").forEach(function (ch, i) { B64[ch.charCodeAt(0)] = i; });

  function b64bytes(s) {
    let len = s.length;
    while (len > 0 && s.charAt(len - 1) === "=") len--;
    const out = new Uint8Array((len * 3) >> 2);
    let o = 0, acc = 0, bits = 0;
    for (let i = 0; i < len; i++) {
      acc = ((acc << 6) | B64[s.charCodeAt(i)]) & 0xffffff;
      bits += 6;
      if (bits >= 8) { bits -= 8; out[o++] = (acc >> bits) & 255; }
    }
    return out;
  }
  /* uint16 LE per in-part cell -> Float32Array over the full grid */
  function u16(s, vmax, cells, n) {
    const b = b64bytes(s), out = new Float32Array(n);
    for (let i = 0; i < cells.length; i++) out[cells[i]] = (b[2 * i] | (b[2 * i + 1] << 8)) / 65535 * vmax;
    return out;
  }
  function rleCells(r) {
    let n = 0;
    for (let i = 1; i < r.length; i += 2) n += r[i];
    const out = new Int32Array(n);
    let j = 0;
    for (let i = 0; i < r.length; i += 2) for (let q = 0; q < r[i + 1]; q++) out[j++] = r[i] + q;
    return out;
  }
  /* direction codes: 0 none, 1 +1, 2 +W, 3 -1, 4 -W */
  function applyCodes(nxt, cells, codes, W) {
    const off = [0, 1, W, -1, -W];
    for (let i = 0; i < cells.length; i++) {
      const c = codes.charCodeAt(i) - 48;
      nxt[cells[i]] = c > 0 ? cells[i] + off[c] : -1;
    }
  }
  /* strokes from nxt: heads (no predecessor) first, then loops from their seam, then any other loop */
  function walk(nxt, cells, seam, n) {
    const prv = new Int32Array(n).fill(-1);
    for (let i = 0; i < cells.length; i++) { const a = cells[i], b = nxt[a]; if (b >= 0) prv[b] = a; }
    const seen = new Uint8Array(n), strokes = [];
    function run(st, head) {
      const c = [];
      let x = st;
      while (x !== -1 && !seen[x]) { seen[x] = 1; c.push(x); x = nxt[x]; }
      strokes.push({ c: c, loop: !head && x === st });
    }
    for (let i = 0; i < cells.length; i++) { const a = cells[i]; if (prv[a] === -1) run(a, true); }
    const ss = Array.from(seam).sort(function (a, b) { return a - b; });
    for (let i = 0; i < ss.length; i++) { const a = ss[i]; if (a >= 0 && a < n && !seen[a] && prv[a] !== -1) run(a, false); }
    for (let i = 0; i < cells.length; i++) { const a = cells[i]; if (!seen[a]) run(a, false); }
    return { strokes: strokes, prv: prv };
  }
  /* greedy nearest-neighbour order from the grid origin (same rule as the time model) */
  function nnOrder(strokes, W, p) {
    const S = strokes.length, left = new Uint8Array(S), out = [];
    const su = new Float64Array(S), sv = new Float64Array(S), eu = new Float64Array(S), ev = new Float64Array(S);
    for (let i = 0; i < S; i++) {
      const c = strokes[i].c, a = c[0], e = strokes[i].loop ? c[0] : c[c.length - 1];
      const ra = Math.floor(a / W), re = Math.floor(e / W);
      su[i] = (a - ra * W + 0.5) * p; sv[i] = (ra + 0.5) * p;
      eu[i] = (e - re * W + 0.5) * p; ev[i] = (re + 0.5) * p;
    }
    let cu = 0, cv = 0;
    for (let k = 0; k < S; k++) {
      let best = -1, bd = Infinity;
      for (let i = 0; i < S; i++) {
        if (left[i]) continue;
        const du = su[i] - cu, dv = sv[i] - cv, d = du * du + dv * dv;
        if (d < bd) { bd = d; best = i; }
      }
      left[best] = 1; out.push(strokes[best]); cu = eu[best]; cv = ev[best];
    }
    return out;
  }
  function orderBy(strokes, order) {
    const byFirst = new Map();
    for (let i = 0; i < strokes.length; i++) byFirst.set(strokes[i].c[0], strokes[i]);
    const out = [];
    for (let i = 0; i < order.length; i++) {
      const s = byFirst.get(order[i]);
      if (s) { out.push(s); byFirst.delete(order[i]); }
    }
    byFirst.forEach(function (s) { out.push(s); });
    return out;
  }
  function makeHist(H) {
    if (!H || !H.n) return null;
    const snapsBy = new Map(), diffsBy = new Map();
    H.snaps.forEach(function (x) {
      if (!snapsBy.has(x[0])) snapsBy.set(x[0], []);
      snapsBy.get(x[0]).push({ applied: x[1], nx: x[2], seam: x[3] });
    });
    snapsBy.forEach(function (a) { a.sort(function (x, y) { return x.applied - y.applied; }); });
    H.diffs.forEach(function (x) {
      const k = H.layer[x[0]];
      if (!diffsBy.has(k)) diffsBy.set(k, []);
      diffsBy.get(k).push({ it: x[0], runs: x[1], nx: x[2], sadd: x[3], sdel: x[4], cells: null });
    });
    diffsBy.forEach(function (a) { a.sort(function (x, y) { return x.it - y.it; }); });
    return { H: H, snapsBy: snapsBy, diffsBy: diffsBy, accAt: function (i) { return H.acc.charCodeAt(i) === 49; } };
  }
  function lowerBound(arr, val) {
    let lo = 0, hi = arr.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m].it < val) lo = m + 1; else hi = m; }
    return lo;
  }
  /* flat cells of a diff: runs index the layer's sorted in-part cell list */
  function diffCells(G, df) {
    if (!df.cells) {
      const r = df.runs;
      let n = 0;
      for (let i = 1; i < r.length; i += 2) n += r[i];
      const out = new Int32Array(n);
      let j = 0;
      for (let i = 0; i < r.length; i += 2) for (let q = 0; q < r[i + 1]; q++) out[j++] = G.cells[r[i] + q];
      df.cells = out;
    }
    return df.cells;
  }
  function findDiff(hist, k, it) {
    const ds = hist.diffsBy.get(k) || [];
    const i = lowerBound(ds, it);
    return i < ds.length && ds[i].it === it ? ds[i] : null;
  }
  /* cover of layer k after s proposals; reuses `prev` (same layer, earlier s) when possible */
  function replay(hist, G, k, s, prev) {
    const snaps = hist.snapsBy.get(k) || [];
    let sn = null;
    for (let i = 0; i < snaps.length && snaps[i].applied <= s; i++) sn = snaps[i];
    if (!sn) return null;
    let st;
    if (prev && prev.k === k && prev.s <= s && prev.s >= sn.applied) {
      st = prev;
    } else {
      const nxt = new Int32Array(G.n).fill(-1);
      applyCodes(nxt, G.cells, sn.nx, G.W);
      st = { k: k, s: sn.applied, nxt: nxt, seam: new Set(sn.seam) };
    }
    const ds = hist.diffsBy.get(k) || [];
    for (let i = lowerBound(ds, st.s); i < ds.length && ds[i].it < s; i++) {
      const df = ds[i];
      applyCodes(st.nxt, diffCells(G, df), df.nx, G.W);
      for (let j = 0; j < df.sdel.length; j++) st.seam.delete(df.sdel[j]);
      for (let j = 0; j < df.sadd.length; j++) st.seam.add(df.sadd[j]);
    }
    st.s = s;
    return st;
  }
  return { b64bytes: b64bytes, u16: u16, rleCells: rleCells, applyCodes: applyCodes, walk: walk,
           nnOrder: nnOrder, orderBy: orderBy, makeHist: makeHist, replay: replay, findDiff: findDiff,
           diffCells: diffCells };
})();

if (typeof document !== "undefined") (function () {
  const DATA = JSON.parse(document.getElementById("rltp-data").textContent);
  const LAY = DATA.layers, NL = LAY.length, HI = RLTP.makeHist(DATA.hist);
  const $ = function (id) { return document.getElementById(id); };
  const canvas = $("view"), ctx = canvas.getContext("2d");
  const chart = $("chart"), cctx = chart.getContext("2d");
  const S = { tab: "layer", layer: 0, color: "direction", travels: true, markers: true, t: 0, speed: 10,
              playing: false, iter: HI ? HI.H.n : 0, follow: true, hspeed: 20, hacc: 0 };

  /* ---------------- theme and colour ramps */
  const C = {};
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    ["bg", "fg", "muted", "panel", "border", "accent", "travel", "seam", "end", "hl", "path", "grid", "reject"].forEach(function (k) {
      C[k] = cs.getPropertyValue("--" + k).trim();
    });
    const th = document.documentElement.getAttribute("data-theme");
    C.dark = th === "dark" || (th !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    const l = C.dark ? 63 : 44;
    C.dir = []; for (let i = 0; i < 36; i++) C.dir.push("hsl(" + (i * 10) + ",78%," + l + "%)");
    C.stroke = []; for (let i = 0; i < 48; i++) C.stroke.push("hsl(" + ((i * 137.508) % 360).toFixed(1) + ",62%," + l + "%)");
  }
  const VIRIDIS = ["#440154", "#472d7b", "#3b528b", "#2c728e", "#21918c", "#28ae80", "#5ec962", "#addc30", "#fde725"];
  const YLORRD = ["#ffffcc", "#ffeda0", "#fed976", "#feb24c", "#fd8d3c", "#fc4e2a", "#e31a1c", "#bd0026", "#800026"];
  function hexrgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function ramp(stops, nb) {
    const rgb = stops.map(hexrgb), out = [];
    for (let i = 0; i < nb; i++) {
      const x = i / (nb - 1) * (rgb.length - 1), j = Math.min(Math.floor(x), rgb.length - 2), f = x - j;
      const c = [0, 1, 2].map(function (q) { return Math.round(rgb[j][q] + (rgb[j + 1][q] - rgb[j][q]) * f); });
      out.push("rgb(" + c[0] + "," + c[1] + "," + c[2] + ")");
    }
    return out;
  }
  const ORDER_C = ramp(VIRIDIS, 64), FI_C = ramp(YLORRD, 32);
  const TERM_C = { strength: "#e03131", time: "#1c7ed6", cont: "#2f9e44", inter: "#ae3ec9" };

  /* ---------------- layers (decoded lazily, LRU) */
  const cache = new Map();
  function layer(k) {
    let G = cache.get(k);
    if (G) { cache.delete(k); cache.set(k, G); return G; }
    const d = LAY[k], W = d.W, n = d.H * d.W, f = d.f;
    const ox = f[0], oy = f[1], th = f[2], p = f[3];
    const cells = RLTP.rleCells(d.rle), cs = Math.cos(th), sn = Math.sin(th);
    const X = new Float64Array(n), Y = new Float64Array(n);
    for (let i = 0; i < cells.length; i++) {
      const a = cells[i], r = Math.floor(a / W), u = (a - r * W + 0.5) * p, v = (r + 0.5) * p;
      X[a] = ox + cs * u - sn * v; Y[a] = oy + sn * u + cs * v;
    }
    G = { k: k, d: d, W: W, n: n, cells: cells, X: X, Y: Y, th: th, p: p, cs: cs, sn: sn,
          t: d.t ? RLTP.u16(d.t, d.T || 0, cells, n) : new Float32Array(n),
          fi: d.fi ? RLTP.u16(d.fi, d.fimax, cells, n) : null, hist: null };
    const nxt = new Int32Array(n).fill(-1);
    RLTP.applyCodes(nxt, cells, d.nx, W);
    G.final = coverOf(G, nxt, new Set(d.seam), d.order);
    cache.set(k, G);
    if (cache.size > 16) cache.delete(cache.keys().next().value);
    return G;
  }
  function coverOf(G, nxt, seam, order) {
    const w = RLTP.walk(nxt, G.cells, seam, G.n);
    const strokes = order ? RLTP.orderBy(w.strokes, order) : RLTP.nnOrder(w.strokes, G.W, G.p);
    return { nxt: nxt, prv: w.prv, seam: seam, strokes: strokes };
  }
  function histState(k, s) {
    const G = layer(k);
    if (G.hist && G.hist.s === s) return G.hist;
    const st = RLTP.replay(HI, G, k, s, G.hist ? G.hist.st : null);
    if (!st) return null;
    G.hist = { s: s, st: st, cover: coverOf(G, st.nxt, st.seam, null) };
    return G.hist;
  }

  /* ---------------- view transform */
  const V = { cx: 0, cy: 0, sc: 1, w: 300, h: 300, dpr: 1, fitted: false };
  const BB = (function () {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    LAY.forEach(function (d) {
      const ox = d.f[0], oy = d.f[1], c = Math.cos(d.f[2]), s = Math.sin(d.f[2]), p = d.f[3];
      [[0, 0], [d.W * p, 0], [0, d.H * p], [d.W * p, d.H * p]].forEach(function (uv) {
        const x = ox + c * uv[0] - s * uv[1], y = oy + s * uv[0] + c * uv[1];
        x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
      });
    });
    return { x0: x0, y0: y0, x1: x1, y1: y1 };
  })();
  function fit() {
    const bw = Math.max(BB.x1 - BB.x0, 1e-6), bh = Math.max(BB.y1 - BB.y0, 1e-6);
    V.sc = 0.92 * Math.min(V.w / bw, V.h / bh);
    V.cx = (BB.x0 + BB.x1) / 2; V.cy = (BB.y0 + BB.y1) / 2;
  }
  function sx(x) { return (x - V.cx) * V.sc + V.w / 2; }
  function sy(y) { return V.h / 2 - (y - V.cy) * V.sc; }
  function zoomAt(mx, my, f) {
    const wx = V.cx + (mx - V.w / 2) / V.sc, wy = V.cy - (my - V.h / 2) / V.sc;
    V.sc = Math.min(Math.max(V.sc * f, 1e-3), 1e5);
    V.cx = wx - (mx - V.w / 2) / V.sc; V.cy = wy + (my - V.h / 2) / V.sc;
  }

  /* ---------------- drawing */
  function cellPath(G, list, path) {
    const h = G.p / 2 * V.sc, ux = G.cs * h, uy = -G.sn * h, vx = -G.sn * h, vy = -G.cs * h;
